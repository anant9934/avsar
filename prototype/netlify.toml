[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# This is a static demonstration only. Do not treat the Netlify deployment
# as a production job marketplace or real identity federation service.
